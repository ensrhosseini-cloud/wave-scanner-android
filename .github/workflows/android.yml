name: Build Android debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip patch autoconf automake autopoint gettext libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          command -v autopoint
          python -m pip install 'buildozer==1.5.0' 'Cython==0.29.36' 'setuptools==68.2.2' 'wheel==0.43.0'
      - name: Prepare pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git .p4a
          python - <<'PY'
          from pathlib import Path
          import configparser
          import re
          root = Path('.p4a/pythonforandroid/recipes')
          # Use setup.py-based recipes compatible with Python 3.11, rather
          # than a moving develop branch selecting Python 3.14 / NumPy 2.3.
          fixes = {
              'numpy': ('1.24.4', '''
              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  from pathlib import Path
                  base = Path(self.get_build_dir(arch.arch))
                  p = base / 'numpy/distutils/system_info.py'
                  text = p.read_text()
                  import re
                  text = re.sub(r'^(default_(?:lib|runtime|include|src)_dirs) = \\[.*$', r'\\1 = []', text, flags=re.M)
                  text = text.replace('        return path\\n', '        return []\\n')
                  p.write_text(text)
                  p = base / 'numpy/distutils/unixccompiler.py'
                  text = p.read_text()
                  marker = "        self.ranlib = [os.environ.get('RANLIB')]\\n"
                  if marker not in text:
                      text = text.replace('        if self.ranlib:\\n', marker + '        if self.ranlib:\\n', 1)
                  p.write_text(text)
                  p = base / 'numpy/linalg/setup.py'
                  text = p.read_text()
                  text = text.replace("libraries=['npymath'],", "libraries=['npymath', 'm'],")
                  text = text.replace("extra_info=lapack_info,\\n    )", "extra_info=lapack_info,\\n        libraries=['m'],\\n    )")
                  p.write_text(text)
                  # Keep compiler/configuration diagnostics visible. NumPy normally
                  # lowers the log threshold while generating config headers.
                  p = base / 'numpy/distutils/command/build_src.py'
                  text = p.read_text()
                  needle = 'old_level = log.set_threshold(new_level)'
                  replacement = 'old_level = log.set_threshold(log.DEBUG, force=True)'
                  assert needle in text or replacement in text, 'NumPy configuration logging hook changed'
                  text = text.replace(needle, replacement, 1)
                  p.write_text(text)
          '''),
              'pandas': ('1.5.3', '''
              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  from pathlib import Path
                  p = Path(self.get_build_dir(arch.arch)) / 'setup.py'
                  text = p.read_text()
                  if "os.environ.get('NUMPY_INCLUDES')" not in text:
                      text = text.replace('numpy.get_include()', "(os.environ.get('NUMPY_INCLUDES') or numpy.get_include())")
                  p.write_text(text)
          '''),
          }
          import textwrap
          source_urls = {
              'numpy': 'https://files.pythonhosted.org/packages/a4/9b/027bec52c633f6556dba6b722d9a0befb40498b9ceddd29cbe67a45a127c/numpy-1.24.4.tar.gz',
              'pandas': 'https://files.pythonhosted.org/packages/74/ee/146cab1ff6d575b54ace8a6a5994048380dc94879b0125b25e62edcb9e52/pandas-1.5.3.tar.gz',
          }
          for name, (version, method) in fixes.items():
              p = root / name / '__init__.py'
              text = p.read_text()
              text = re.sub(r"    version = '[^']+'", f"    version = '{version}'", text, count=1)
              text, count = re.subn(r"^    url = [^\n]+", f"    url = {source_urls[name]!r}", text, count=1, flags=re.M)
              assert count == 1, f'{name}: source URL not found'
              text, count = re.subn(r'    patches = \[.*?\]', '    patches = []', text, count=1, flags=re.S)
              assert count == 1, name
              if name == 'numpy':
                  marker = '        env["NPY_DISABLE_SVML"] = "1"'
                  assert marker in text, 'NumPy environment hook changed'
                  # Prefer libm explicitly; do not skip any feature checks.
                  text = text.replace(marker, marker + '\n        env["MATHLIB"] = "m"', 1)
              method = textwrap.indent(textwrap.dedent(method).strip(), '    ')
              text = text.replace('\nrecipe = ', '\n' + method + '\n\nrecipe = ', 1)
              compile(text, str(p), 'exec')
              p.write_text(text)
          spec = Path('buildozer.spec')
          cfg = configparser.ConfigParser(interpolation=None)
          cfg.read(spec)
          app = cfg['app']
          app['requirements'] = 'python3==3.11.5,hostpython3==3.11.5,kivy==2.3.1,numpy==1.24.4,pandas==1.5.3,requests,certifi,arabic-reshaper,python-bidi==0.4.2,pyjnius'
          app['p4a.source_dir'] = str(Path('.p4a').resolve())
          excluded = app.get('source.exclude_dirs', '')
          app['source.exclude_dirs'] = excluded + ',.p4a'
          with spec.open('w') as f:
              cfg.write(f)
          print('Pinned: p4a v2024.01.21 / Python 3.11.5 / NumPy 1.24.4 / pandas 1.5.3')
          PY
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          buildozer -v android debug 2>&1 | tee android-build.log
      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          if [ -f android-build.log ]; then
            cp android-build.log build-diagnostics/
          fi
          python - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('build-diagnostics')
          root = Path('.buildozer')
          if root.exists():
              names = {'config.log', 'CMakeError.log', 'CMakeOutput.log', '_configtest.c'}
              for p in root.rglob('*'):
                  if p.is_file() and p.name in names:
                      dest = target / p
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(p, dest)
          for name in ('numpy', 'pandas'):
              p = Path('.p4a/pythonforandroid/recipes') / name / '__init__.py'
              if p.exists():
                  shutil.copy2(p, target / (name + '-recipe.py'))
          PY
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaveScanner-build-diagnostics
          path: build-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: WaveScanner-Android-debug
          path: bin/*.apk
          if-no-files-found: error
